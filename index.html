<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Переход в Telegram</title>

  <!-- Не обязательно, но можно оставить счётчик Метрики на странице -->
  <!-- Замени код ниже на полный код счётчика из Метрики, если хочешь учитывать визит -->
</head>
<body>
  <div style="font-family: Arial, sans-serif; padding: 24px;">
    <h2>Открываем Telegram...</h2>
    <p id="status">Подождите пару секунд.</p>
    <p>
      <a id="manualLink" href="#" style="display:none;">Открыть Telegram вручную</a>
    </p>
  </div>

  <script>
    const BOT_USERNAME = "kkaprizbot"; // без @
    const REDIRECT_DELAY_MS = 500;

    function getParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function normalizeYclid(value) {
      if (!value) return null;

      // yclid обычно цифровой. На всякий случай чистим всё лишнее.
      const cleaned = String(value).trim().replace(/[^0-9]/g, "");

      // Чтобы не передавать мусор.
      if (!/^[0-9]{6,40}$/.test(cleaned)) return null;

      return cleaned;
    }

    function buildStartPayload() {
      const yclid = normalizeYclid(getParam("yclid"));

      if (yclid) {
        // Префикс y_ нужен, чтобы бот понимал: это именно yclid.
        return "y_" + yclid;
      }

      // Если человек пришёл не из Яндекса или yclid потерялся.
      return "no_yclid";
    }

    function redirectToBot() {
      const payload = buildStartPayload();
      const tgUrl = `https://t.me/${BOT_USERNAME}?start=${encodeURIComponent(payload)}`;

      document.getElementById("status").innerText = `Переходим в Telegram. Payload: ${payload}`;
      const manualLink = document.getElementById("manualLink");
      manualLink.href = tgUrl;
      manualLink.style.display = "inline";

      setTimeout(() => {
        window.location.replace(tgUrl);
      }, REDIRECT_DELAY_MS);
    }

    redirectToBot();
  </script>
</body>
</html>
