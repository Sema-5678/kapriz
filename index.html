<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каприз — Telegram-бот</title>
  <meta name="description" content="Откройте Telegram-бота Каприз, чтобы продолжить.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1f2933;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #229ed9;
      color: #fff;
      font-size: 34px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 18px;
      color: #5f6b7a;
      font-size: 16px;
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      width: 100%;
      max-width: 320px;
      padding: 14px 18px;
      border-radius: 12px;
      background: #229ed9;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
    }

    .note {
      margin-top: 16px;
      font-size: 13px;
      color: #8a94a3;
    }

    .debug {
      display: none;
      margin-top: 22px;
      text-align: left;
      background: #f3f4f6;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #374151;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="logo">К</div>

      <h1>Каприз в Telegram</h1>

      <p>
        Нажмите кнопку ниже, чтобы открыть Telegram-бота и продолжить диалог.
      </p>

      <a id="botLink" class="button" href="https://t.me/kkaprizbot" rel="nofollow">
        Открыть Telegram-бота
      </a>

      <div class="note">
        Если Telegram не открылся автоматически, нажмите кнопку еще раз.
      </div>

      <pre id="debug" class="debug"></pre>
    </section>
  </main>

  <script>
    const BOT_USERNAME = "kkaprizbot";

    const params = new URLSearchParams(window.location.search);

    const yclid = params.get("yclid");
    const debugMode = params.get("debug") === "1";

    function sanitizeTelegramStart(value) {
      return String(value || "")
        .replace(/[^a-zA-Z0-9_-]/g, "_")
        .slice(0, 60);
    }

    let startPayload = "site_no_yclid";

    if (yclid) {
      startPayload = "yd_" + sanitizeTelegramStart(yclid);
    }

    const botUrl =
      "https://t.me/" +
      BOT_USERNAME +
      "?start=" +
      encodeURIComponent(startPayload);

    const botLink = document.getElementById("botLink");
    botLink.href = botUrl;

    if (debugMode) {
      const debug = document.getElementById("debug");
      debug.style.display = "block";
      debug.textContent =
        "currentUrl: " + window.location.href + "\n" +
        "yclid: " + (yclid || "нет") + "\n" +
        "startPayload: " + startPayload + "\n" +
        "botUrl: " + botUrl;
    }

    // Важно:
    // Никакого window.location.href.
    // Никакого window.location.replace.
    // Никакого setTimeout с переходом.
    // Переход в Telegram происходит только после клика по кнопке.
  </script>
</body>
</html>
