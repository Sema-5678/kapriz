<body>
  <div class="wrap">
    <h2>Открываем Telegram...</h2>
    <p id="status">Переход будет выполнен автоматически.</p>

    <a id="manualLink" class="button" href="#">
      Открыть Telegram вручную
    </a>

    <div class="small">
      Если Telegram не открылся автоматически, нажмите кнопку.
    </div>

    <div id="debugBox" class="debug"></div>
  </div>

  <script>
    const COUNTER_ID = 104141748;
    const BOT_USERNAME = "kkaprizbot";

    const GOAL_BOT_REDIRECT = "BOT_REDIRECT";

    // Главное отличие: короткое ожидание, а не 7+4+4 сек.
    const MAX_METRIKA_WAIT_MS = 700;

    const DEBUG_MODE = getParam("debug") === "1";

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function normalizeYclid(value) {
      if (!value) return null;

      const cleaned = String(value).trim().replace(/[^0-9]/g, "");

      if (!/^[0-9]{6,40}$/.test(cleaned)) {
        return null;
      }

      return cleaned;
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function buildData() {
      const params = new URLSearchParams(window.location.search);

      const yclid = normalizeYclid(params.get("yclid"));

      const payload = yclid ? "y_" + yclid : "no_yclid";

      const tgUrl =
        "https://t.me/" +
        BOT_USERNAME +
        "?start=" +
        encodeURIComponent(payload);

      return {
        yclid,
        payload,
        tgUrl,
        utm_source: params.get("utm_source") || "",
        utm_medium: params.get("utm_medium") || "",
        utm_campaign: params.get("utm_campaign") || "",
        utm_content: params.get("utm_content") || "",
        utm_term: params.get("utm_term") || "",
        referrer: document.referrer || ""
      };
    }

    function sendGoalWithShortTimeout(goalName, goalParams) {
      return new Promise(resolve => {
        let finished = false;

        function done(success) {
          if (finished) return;
          finished = true;
          resolve(success);
        }

        const timeout = setTimeout(() => {
          done(false);
        }, MAX_METRIKA_WAIT_MS);

        try {
          if (typeof ym !== "function") {
            clearTimeout(timeout);
            done(false);
            return;
          }

          ym(COUNTER_ID, "reachGoal", goalName, goalParams, function () {
            clearTimeout(timeout);
            done(true);
          });
        } catch (e) {
          clearTimeout(timeout);
          done(false);
        }
      });
    }

    function showDebug(data, goalSent) {
      const box = document.getElementById("debugBox");

      box.style.display = "block";
      box.innerHTML =
        "<b>DEBUG включён. Редиректа не будет.</b><br><br>" +
        "tgUrl: " + data.tgUrl + "<br>" +
        "payload: " + data.payload + "<br>" +
        "yclid: " + (data.yclid || "нет") + "<br>" +
        "goalSent: " + goalSent + "<br>" +
        "utm_source: " + data.utm_source + "<br>" +
        "utm_medium: " + data.utm_medium + "<br>" +
        "utm_campaign: " + data.utm_campaign + "<br>" +
        "utm_content: " + data.utm_content + "<br>" +
        "utm_term: " + data.utm_term + "<br>" +
        "referrer: " + data.referrer + "<br>";
    }

    async function main() {
      const data = buildData();

      const manualLink = document.getElementById("manualLink");
      manualLink.href = data.tgUrl;

      const goalParams = {
        source: "telegram_redirect_page",
        bot: BOT_USERNAME,
        payload: data.payload,
        yclid_present: data.yclid ? "yes" : "no",
        yclid: data.yclid || "",
        utm_source: data.utm_source,
        utm_medium: data.utm_medium,
        utm_campaign: data.utm_campaign,
        utm_content: data.utm_content,
        utm_term: data.utm_term,
        referrer: data.referrer
      };

      // Даем счетчику минимальное время стартануть.
      await wait(100);

      const goalSent = await sendGoalWithShortTimeout(
        GOAL_BOT_REDIRECT,
        goalParams
      );

      if (DEBUG_MODE) {
        document.getElementById("status").innerText =
          "DEBUG включён. Редиректа не будет.";

        showDebug(data, goalSent);
        return;
      }

      window.location.replace(data.tgUrl);
    }

    main();
  </script>
</body>
