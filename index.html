<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Переход в Telegram</title>

  <!-- Yandex Metrika -->
  <script>
    const COUNTER_ID = 104141748;

    (function(m,e,t,r,i,k,a){
      m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
      m[i].l=1*new Date();
      for (var j = 0; j < document.scripts.length; j++) {
        if (document.scripts[j].src === r) { return; }
      }
      k=e.createElement(t);
      a=e.getElementsByTagName(t)[0];
      k.async=1;
      k.src=r;
      a.parentNode.insertBefore(k,a);
    })(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

    ym(COUNTER_ID, "init", {
      clickmap: false,
      trackLinks: false,
      accurateTrackBounce: false
    });
  </script>

  <noscript>
    <div>
      <img src="https://mc.yandex.ru/watch/104141748" style="position:absolute; left:-9999px;" alt="" />
    </div>
  </noscript>
  <!-- /Yandex Metrika -->
</head>

<body>
  <div style="font-family: Arial, sans-serif; padding: 24px;">
    <h2>Открываем Telegram...</h2>
    <p id="status">Если переход не произошёл, нажмите кнопку ниже.</p>
    <p>
      <a id="manualLink" href="#">Открыть Telegram</a>
    </p>
  </div>

  <script>
    const BOT_USERNAME = "kkaprizbot"; // без @

    const GOAL_PAGE_OPEN = "PAGE_OPEN";
    const GOAL_BOT_REDIRECT = "BOT_REDIRECT";

    // Можно уменьшить до 50, если важнее скорость.
    // Можно увеличить до 500, если важнее точность целей на сайте.
    const FAST_REDIRECT_DELAY_MS = 250;

    // Fallback на t.me, если tg:// не открыл приложение.
    const FALLBACK_TO_HTTPS_DELAY_MS = 900;

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    function normalizeYclid(value) {
      if (!value) return null;

      const cleaned = String(value).trim().replace(/[^0-9]/g, "");

      if (!/^[0-9]{6,40}$/.test(cleaned)) return null;

      return cleaned;
    }

    function buildStartPayload() {
      const yclid = normalizeYclid(getParam("yclid"));

      if (yclid) {
        return "y_" + yclid;
      }

      return "no_yclid";
    }

    function sendGoalFast(goalName, params = {}) {
      try {
        if (typeof ym === "function") {
          ym(COUNTER_ID, "reachGoal", goalName, params);
        }
      } catch (error) {
        console.warn("Metrika goal error:", goalName, error);
      }
    }

    function openTelegramFast(tgAppUrl, tgWebUrl) {
      let appWasOpened = false;

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          appWasOpened = true;
        }
      });

      setTimeout(function () {
        // Сначала пробуем открыть приложение Telegram напрямую.
        window.location.href = tgAppUrl;

        // Если приложение не открылось, открываем обычную t.me-ссылку.
        setTimeout(function () {
          if (!appWasOpened) {
            window.location.replace(tgWebUrl);
          }
        }, FALLBACK_TO_HTTPS_DELAY_MS);
      }, FAST_REDIRECT_DELAY_MS);
    }

    function main() {
      const yclid = normalizeYclid(getParam("yclid"));
      const payload = buildStartPayload();

      const tgWebUrl = `https://t.me/${BOT_USERNAME}?start=${encodeURIComponent(payload)}`;
      const tgAppUrl = `tg://resolve?domain=${BOT_USERNAME}&start=${encodeURIComponent(payload)}`;

      const manualLink = document.getElementById("manualLink");
      manualLink.href = tgWebUrl;

      const params = {
        source: "telegram_redirect_page",
        yclid_present: yclid ? "yes" : "no"
      };

      // Эти цели отправляем быстро, не ждём callback.
      sendGoalFast(GOAL_PAGE_OPEN, params);
      sendGoalFast(GOAL_BOT_REDIRECT, params);

      const debugMode = getParam("debug") === "1";

      if (debugMode) {
        document.getElementById("status").innerText =
          `DEBUG: редирект выключен. Payload: ${payload}`;
        return;
      }

      openTelegramFast(tgAppUrl, tgWebUrl);
    }

    main();
  </script>
</body>
</html>
